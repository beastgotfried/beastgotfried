<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Ankush Wadehra codex forge dragon banner</title>
  <desc id="desc">A medieval forge themed profile banner with an animated dragon flying over a castle and glowing code runes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.48" stop-color="#101A36"/>
      <stop offset="1" stop-color="#06251F"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFF7CC"/>
      <stop offset="0.58" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="0.52" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" x2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.96  0 1 0 0 0.63  0 0 1 0 0.12  0 0 0 0.75 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dragonShadow" x="-50%" y="-50%" width="220%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.55"/>
    </filter>
    <pattern id="runes" width="120" height="46" patternUnits="userSpaceOnUse">
      <text x="8" y="31" fill="#60A5FA" opacity="0.12" font-family="JetBrains Mono, Consolas, monospace" font-size="18">01</text>
      <text x="46" y="31" fill="#34D399" opacity="0.13" font-family="JetBrains Mono, Consolas, monospace" font-size="18">{ }</text>
      <text x="88" y="31" fill="#F59E0B" opacity="0.12" font-family="JetBrains Mono, Consolas, monospace" font-size="18">fn</text>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#sky)"/>
  <rect width="1280" height="420" fill="url(#runes)"/>
  <circle cx="1056" cy="84" r="72" fill="url(#moon)" opacity="0.92">
    <animate attributeName="opacity" values="0.78;0.98;0.78" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.78">
    <circle cx="96" cy="70" r="1.7" fill="#FDE68A">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="192" cy="116" r="1.3" fill="#93C5FD">
      <animate attributeName="opacity" values="0.15;0.88;0.15" dur="4.2s" begin=".5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="342" cy="52" r="1.5" fill="#FDE68A">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="645" cy="72" r="1.4" fill="#A7F3D0">
      <animate attributeName="opacity" values="0.18;0.9;0.18" dur="3.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="792" cy="136" r="1.4" fill="#FDE68A">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4.6s" begin=".4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1178" cy="147" r="1.6" fill="#93C5FD">
      <animate attributeName="opacity" values="0.2;0.96;0.2" dur="3.6s" begin=".9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <path d="M0 302 C120 236 220 252 332 278 C482 314 566 206 704 248 C842 290 880 202 1008 230 C1112 253 1198 286 1280 228 L1280 420 L0 420 Z" fill="#08111F" opacity="0.95"/>
  <path d="M0 338 C126 292 244 304 372 326 C496 348 594 284 708 304 C842 328 931 290 1036 312 C1130 332 1204 350 1280 318 L1280 420 L0 420 Z" fill="#030712"/>

  <g transform="translate(835 205)" opacity="0.96">
    <path d="M0 116 L0 42 L24 42 L24 6 L60 6 L60 42 L88 42 L88 -18 L126 -18 L126 42 L154 42 L154 16 L190 16 L190 42 L214 42 L214 116 Z" fill="#0B1020" stroke="#1E293B" stroke-width="2"/>
    <path d="M35 116 L35 77 Q35 58 52 58 Q69 58 69 77 L69 116 Z" fill="#020617" stroke="#F59E0B" stroke-opacity="0.35"/>
    <rect x="103" y="58" width="18" height="28" fill="#FDE68A" opacity="0.38">
      <animate attributeName="opacity" values="0.18;0.58;0.18" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="164" y="59" width="16" height="24" fill="#34D399" opacity="0.28">
      <animate attributeName="opacity" values="0.12;0.46;0.12" dur="3.2s" begin=".7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(70 74)" filter="url(#softGlow)">
    <text x="0" y="0" dominant-baseline="hanging" fill="url(#gold)" font-family="Cinzel, Georgia, serif" font-size="64" font-weight="800" letter-spacing="2">ANKUSH WADEHRA</text>
    <text x="2" y="82" fill="#D1FAE5" font-family="JetBrains Mono, Consolas, monospace" font-size="24" letter-spacing="1">AI AGENTS / APPLIED ML / PRODUCT ENGINEERING</text>
    <path d="M2 126 H554" stroke="url(#emerald)" stroke-width="3" stroke-linecap="round"/>
    <path d="M2 144 H378" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <text x="2" y="184" fill="#CBD5E1" font-family="Georgia, serif" font-size="22">forging systems that survive contact with real users</text>
  </g>

  <g filter="url(#dragonShadow)">
    <animateMotion dur="14s" repeatCount="indefinite" path="M -185 136 C 105 20 294 124 482 75 C 716 14 836 20 1042 88 C 1194 137 1334 91 1468 32" rotate="auto"/>
    <g transform="scale(0.86)">
      <animateTransform attributeName="transform" type="scale" values="0.82;0.92;0.82" dur="5.2s" repeatCount="indefinite" additive="replace"/>
      <path d="M-126 30 C-84 2 -48 -3 -9 16 C-42 -46 -91 -62 -152 -22 C-111 -20 -91 4 -126 30 Z" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
      <path d="M20 16 C57 -48 104 -63 160 -28 C118 -22 91 4 126 31 C85 7 54 6 20 16 Z" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
      <path d="M-102 23 C-48 42 31 42 91 21 C66 53 2 68 -62 51 C-78 47 -94 38 -102 23 Z" fill="#020617" stroke="#34D399" stroke-opacity="0.6" stroke-width="2"/>
      <path d="M-118 31 C-57 11 15 8 94 22 C124 28 142 18 165 3 C150 30 129 45 98 46 C40 48 -40 50 -118 31 Z" fill="#0B1020" stroke="#F59E0B" stroke-width="3"/>
      <path d="M92 22 C123 0 144 -10 171 -7 C194 -4 211 10 219 26 C196 20 178 25 160 39 C139 53 114 50 92 22 Z" fill="#0B1020" stroke="#F59E0B" stroke-width="3"/>
      <path d="M217 26 C245 22 267 32 287 49 C257 48 233 42 207 33 Z" fill="#111827" stroke="#F97316" stroke-width="2"/>
      <circle cx="194" cy="17" r="4" fill="#FDE68A">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M-116 30 C-164 19 -202 38 -236 72 C-195 54 -160 53 -126 44 Z" fill="none" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
      <path d="M-20 48 L-38 78 M38 47 L55 77" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
      <path d="M284 48 C312 48 340 35 363 15 C352 48 322 64 292 57 Z" fill="#F97316" opacity="0.86">
        <animate attributeName="opacity" values="0.25;0.9;0.25" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g transform="translate(0 356)">
    <rect width="1280" height="64" fill="#020617" opacity="0.72"/>
    <path d="M0 12 C180 48 322 -24 510 14 C694 51 830 -8 1010 18 C1130 35 1205 44 1280 17" fill="none" stroke="#F59E0B" stroke-opacity="0.48" stroke-width="2"/>
    <path d="M0 30 C178 70 346 2 516 32 C711 66 862 7 1012 36 C1148 62 1208 65 1280 39" fill="none" stroke="#34D399" stroke-opacity="0.28" stroke-width="2"/>
  </g>
</svg>
