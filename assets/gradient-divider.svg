      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="0.32" stop-color="#8B5CF6"/>
      <stop offset="0.66" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#F59E0B"/>
